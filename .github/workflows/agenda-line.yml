name: Move agenda line

on:
  schedule:
    # Cron is UTC. In November Berlin is UTC+1 (CET); during summer time (CEST) subtract one more hour.
    # Two long-running jobs cover 09:00-17:00 Berlin because a hosted job may run at most 6h.
    # Avoid :00 — GitHub delays scheduled runs most at the top of the hour.
    - cron: "50 7 * * 1-5"   # 08:50 Berlin, loops until ~14:40
    - cron: "50 11 * * 1-5"  # 12:50 Berlin, takes over and loops until 17:00
  workflow_dispatch:
    inputs:
      mode:
        description: "loop, once, or inspect"
        default: loop
        type: choice
        options: [loop, once, inspect]

# A newer run cancels the older one, so the second cron cleanly takes over.
concurrency:
  group: agenda-line
  cancel-in-progress: true

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
      MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
      MIRO_ITEM_ID: ${{ secrets.MIRO_ITEM_ID }}
      # Repo variables (Settings → Secrets and variables → Actions → Variables).
      # AGENDA_STOPS: calibrate with "inspect" mode, e.g. "09:00=0,12:00=300,17:00=1000"
      AGENDA_STOPS: ${{ vars.AGENDA_STOPS }}
      # OFFSITE_DATES: e.g. "2026-11-24,2026-11-25"; empty = run every weekday
      OFFSITE_DATES: ${{ vars.OFFSITE_DATES }}
      INTERVAL_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move line
        run: |
          case "${{ inputs.mode || 'loop' }}" in
            loop)    python scripts/move_obj.py --loop ;;
            once)    python scripts/move_obj.py ;;
            inspect) python scripts/move_obj.py --inspect ;;
          esac
